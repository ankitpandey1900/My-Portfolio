name: Code Integration Quality Verification (CI)

# Trigger workflows on pushes or pull request updates targeting principal branches
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    name: Compile Validation & Lint checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Clean Install NPM Packages
        # Clean dependencies install using locked packages list
        run: npm ci

      - name: Validate TypeScript Types
        # Runs tsc compilation validations
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Validate Code Style Formats
        # Verifies files styling formatting standards
        run: npm run format:check

      - name: Execute ESLint Inspections
        # Validates code standards and catches code smell configurations
        run: npm run lint

      - name: Production Standalone Build check
        # Validates Next.js compilation loops and bundles output STANDALONE files
        run: npm run build
        env:
          # Inject dummy environment metrics to bypass runtime env check triggers
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key-placeholder
          RESEND_API_KEY: dummy-resend-key-placeholder
          NOTIFICATION_EMAIL_RECIPIENT: dummy-receiver@domain.com
          GITHUB_PERSONAL_ACCESS_TOKEN: dummy-github-token-placeholder

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Clean Install NPM Packages
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production Standalone Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key-placeholder
          RESEND_API_KEY: dummy-resend-key-placeholder
          NOTIFICATION_EMAIL_RECIPIENT: dummy-receiver@domain.com
          GITHUB_PERSONAL_ACCESS_TOKEN: dummy-github-token-placeholder

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3005
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key-placeholder
          RESEND_API_KEY: dummy-resend-key-placeholder
          NOTIFICATION_EMAIL_RECIPIENT: dummy-receiver@domain.com
          GITHUB_PERSONAL_ACCESS_TOKEN: dummy-github-token-placeholder
